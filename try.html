  <meta property="og:site_name" content="AI 面试教练">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a6df0'/%3E%3C/svg%3E">
  <style>
    .try-q{font-size:20px;line-height:1.7;font-weight:600;color:var(--wb-text);margin:6px 0 14px;}
    .try-meta{font-size:12px;color:var(--wb-muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .try-tag{display:inline-block;background:var(--wb-blue-l);color:var(--wb-blue);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;}
    .try-swap{background:none;border:0;color:var(--wb-blue);cursor:pointer;font-size:12px;padding:0;font-family:inherit;text-decoration:underline;}
    .try-note{font-size:12.5px;color:var(--wb-muted);margin-top:10px;line-height:1.7;}
    .try-msg{font-size:13px;margin-top:10px;min-height:20px;}
    .try-msg.err{color:#c0392b;}
    .try-msg.ok{color:#1e8e57;}
    .try-score{font-size:34px;font-weight:800;color:var(--wb-blue);line-height:1;}
    .try-score em{font-size:14px;color:var(--wb-muted);font-style:normal;font-weight:500;}
    .try-comment{background:var(--wb-blue-l);border-left:3px solid var(--wb-blue);border-radius:0 8px 8px 0;
      padding:12px 14px;font-size:14px;line-height:1.8;color:var(--wb-text);margin:14px 0;}
    .try-dims{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;margin-top:6px;}
    .try-dim{font-size:12.5px;color:var(--wb-muted);}
    .try-dim b{color:var(--wb-text);font-weight:600;}
    .try-bar{height:5px;border-radius:3px;background:var(--wb-border);margin-top:4px;overflow:hidden;}
    .try-bar i{display:block;height:100%;background:var(--wb-blue);border-radius:3px;}
    .try-list{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.85;color:var(--wb-text);}
    .try-list li{margin-bottom:4px;}
    .try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
    .try-quota{font-size:12px;color:var(--wb-muted);margin-top:8px;}
    @media(max-width:560px){
      .try-q{font-size:17px;}
      .try-dims{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="page-title">先试一题</h1>
    <p class="page-sub">不用选岗位、不用注册。答一道通用题，看看 AI 会怎么评你——大约 15 秒出结果。</p>

    <div class="card" id="try-card">
      <div class="try-meta">
        <span class="try-tag" id="try-type">行为面试</span>
        <span id="try-count">第 1 / 8 题</span>
        <button class="try-swap" id="try-swap">换一题</button>
      </div>
      <div class="try-q" id="try-q">加载中…</div>

      <textarea id="try-answer" rows="6" placeholder="像真实面试一样作答，写 3–5 句就够。AI 会看你的结构、证据和结论。"
        style="width:100%;border:1.5px solid var(--wb-border);border-radius:10px;padding:12px;font-size:14px;line-height:1.7;font-family:inherit;resize:vertical;background:var(--wb-card);color:var(--wb-text);"></textarea>
      <div class="try-meta" style="margin-top:8px;justify-content:space-between;">
        <span id="try-len">0 字</span>
        <span>建议 80 字以上</span>
      </div>

      <div class="try-msg" id="try-msg"></div>

      <div class="try-actions">
        <button class="btn btn-primary" id="try-go">让 AI 评一评 →</button>
      </div>
      <p class="try-quota" id="try-quota"></p>
      <p class="try-note">作答内容只用于本次点评，不保存、不上云存档；刷新页面即清空。</p>
    </div>

    <div class="card" id="try-result" style="display:none;"></div>

    <div class="card" id="try-cta" style="display:none;">
      <div class="card-title"><span class="ic"></span>想看完整的？</div>
      <p class="page-sub" style="margin-bottom:14px;">正式面试会按你选的岗位出题、逐题追问，结束后给一份完整评分报告（六维得分 + 逐题点评 + 改进建议）。</p>
      <div class="try-actions" style="margin-top:0;">
        <a class="btn btn-primary" href="index.html?len=3">开始 3 题快练（约 5 分钟）→</a>
        <button class="btn btn-ghost" id="try-again">再试一道</button>
      </div>
    </div>
  </main>

  <script src="assets/js/vendor/workbuddy-cloud-sdk.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/cloud.js"></script>
  <script src="assets/js/analytics.js"></script>
  <script src="assets/js/llm.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/try.js"></script>
</body>
</html>
