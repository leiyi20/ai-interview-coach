<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AI 模拟面试 · 语音通话</title>
<style>
  :root {
    --bg: #0b0f17;
    --bg2: #131a26;
    --card: rgba(255, 255, 255, 0.06);
    --line: rgba(255, 255, 255, 0.10);
    --text: #eef2f7;
    --muted: #93a0b4;
    --accent: #4f8cff;
    --accent2: #28c0a8;
    --danger: #ff4d5e;
    --ai-bubble: rgba(79, 140, 255, 0.16);
    --me-bubble: rgba(40, 192, 168, 0.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, var(--bg2), var(--bg) 60%);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* 手机外框：桌面端呈现为居中卡片，移动端铺满 */
  #app {
    position: relative;
    width: 100%; max-width: 420px; height: 100%;
    max-height: 880px;
    background: linear-gradient(180deg, #0e1420, #0a0e16);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 460px) {
    #app { border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.55); height: 92vh; }
  }

  /* 顶部状态条 */
  .statusbar {
    height: 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; font-size: 13px; color: var(--muted);
  }
  .statusbar .brand { color: var(--accent); font-weight: 600; letter-spacing: .5px; }

  /* 通话主区 */
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding: 10px 20px 0; min-height: 0; }

  .avatar-wrap { position: relative; margin-top: 18px; }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, #2b6cff, #28c0a8);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 700; color: #fff;
    box-shadow: 0 10px 30px rgba(43,108,255,.35);
  }
  .avatar-wrap::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid transparent;
  }
  .avatar-wrap.speaking::after {
    border-color: rgba(79,140,255,.6);
    animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: .9; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  .role-name { margin-top: 14px; font-size: 18px; font-weight: 600; }
  .call-state { margin-top: 4px; font-size: 13px; color: var(--muted); }

  .timer { margin-top: 14px; font-size: 26px; font-variant-numeric: tabular-nums;
    letter-spacing: 1px; color: #cdd7e6; }

  /* 音频可视化 */
  .visualizer { display: flex; align-items: flex-end; gap: 4px; height: 34px;
    margin-top: 14px; opacity: .35; transition: opacity .3s; }
  .visualizer.speaking { opacity: 1; }
  .visualizer span { width: 4px; height: 6px; border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), var(--accent2)); }
  .visualizer.speaking span { animation: bars 0.9s ease-in-out infinite; }
  .visualizer span:nth-child(2){ animation-delay: .1s }
  .visualizer span:nth-child(3){ animation-delay: .2s }
  .visualizer span:nth-child(4){ animation-delay: .3s }
  .visualizer span:nth-child(5){ animation-delay: .15s }
  .visualizer span:nth-child(6){ animation-delay: .25s }
  .visualizer span:nth-child(7){ animation-delay: .05s }
  @keyframes bars { 0%,100%{ height:6px } 50%{ height:30px } }

  /* 字幕面板 */
  .subtitles { flex: 1; width: 100%; margin-top: 16px; overflow-y: auto;
    padding: 6px 2px 10px; display: flex; flex-direction: column; gap: 10px; }
  .subtitles.hidden { display: none; }
  .bubble { max-width: 82%; padding: 10px 13px; border-radius: 14px; font-size: 14.5px;
    line-height: 1.5; word-break: break-word; animation: rise .25s ease; }
  .bubble .tag { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .bubble.ai { align-self: flex-start; background: var(--ai-bubble);
    border-top-left-radius: 4px; }
  .bubble.me { align-self: flex-end; background: var(--me-bubble);
    border-top-right-radius: 4px; text-align: left; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity:1; transform:none } }

  /* 戴耳机提示 */
  .hint { margin: 10px 0 4px; font-size: 12.5px; color: var(--muted);
    text-align: center; padding: 8px 12px; border: 1px dashed var(--line);
    border-radius: 12px; background: var(--card); }
  .hint b { color: var(--accent2); }

  /* 底部控件 */
  .controls { display: flex; align-items: center; justify-content: space-around;
    padding: 18px 24px calc(18px + env(safe-area-inset-bottom)); }
  .ctrl { display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: none; color: var(--text); cursor: pointer; font-size: 12px; }
  .ctrl .ic { width: 52px; height: 52px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; transition: .2s; }
  .ctrl.active .ic { background: rgba(79,140,255,.25); border-color: var(--accent); }
  .ctrl.hangup .ic { background: var(--danger); border-color: var(--danger); width: 64px; height: 64px; }
  .ctrl.hangup { color: #ffd2d6; }
  .ctrl:active .ic { transform: scale(.92); }
  svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }

  /* 演示用模拟输入（非真实控件，仅本骨架可交互） */
  .demo-bar { padding: 0 16px 10px; }
  .demo-bar input { width: 100%; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(255,255,255,.04);
    color: var(--text); font-size: 13.5px; outline: none; }
  .demo-bar .lbl { font-size: 11px; color: var(--muted); margin: 0 2px 5px; }

  /* 结束页 */
  .end-screen { position: absolute; inset: 0; background: rgba(8,11,17,.97);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px; text-align: center; }
  .end-screen.show { display: flex; }
  .end-screen h2 { margin: 0 0 6px; font-size: 22px; }
  .end-screen p { color: var(--muted); margin: 4px 0; font-size: 14px; }
  .end-stats { display: flex; gap: 26px; margin: 22px 0; }
  .end-stats div { font-size: 13px; color: var(--muted); }
  .end-stats b { display: block; font-size: 28px; color: var(--text); margin-bottom: 2px; }
  .btn { margin-top: 8px; padding: 12px 26px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; min-width: 160px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn:active { transform: scale(.97); }

  .fallback { position: absolute; top: 50px; right: 14px; font-size: 12px;
    color: var(--muted); text-decoration: underline; cursor: pointer; z-index: 5; }
</style>
</head>
<body>
<div id="app">
  <div class="statusbar">
    <span id="clock">--:--</span>
    <span class="brand">AI 模拟面试</span>
    <span>● 语音</span>
  </div>

  <div class="fallback" onclick="alert('降级入口：将切换到纯文字面试页（待 M1 接入）')">改用文字面试</div>

  <div class="stage">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar">AI</div>
    </div>
    <div class="role-name" id="roleName">后端开发工程师 · 中级</div>
    <div class="call-state" id="callState">正在接通…</div>
    <div class="timer" id="timer">00:00</div>

    <div class="visualizer" id="viz">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="subtitles" id="subs"></div>

    <div class="hint" id="hint">
      建议佩戴耳机以获得最佳体验；通话全程将自动录音用于<b>生成回放与评分</b>。
    </div>
  </div>

  <!-- 真实控件：挂断 / 静音 / 字幕（决策 #3：不做跳过） -->
  <div class="controls">
    <button class="ctrl" id="btnMute" onclick="toggleMute()">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
      <span>静音</span>
    </button>
    <button class="ctrl hangup" onclick="hangup()">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10c5-4 13-4 18 0l-2 3-3-1v-2a12 12 0 0 0-8 0v2l-3 1z"/></svg></span>
      <span>挂断</span>
    </button>
    <button class="ctrl active" id="btnSub" onclick="toggleSub()">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
      <span>字幕</span>
    </button>
  </div>

  <!-- 演示用：模拟用户作答（真实接入后由 ASR 转写替代，非产品控件） -->
  <div class="demo-bar">
    <div class="lbl">演示用 · 模拟你说的话（真实环境由语音识别自动填入）</div>
    <input id="demoInput" placeholder="输入一段模拟回答，回车发送…" onkeydown="if(event.key==='Enter')sendDemo()" />
  </div>

  <!-- 结束页 -->
  <div class="end-screen" id="endScreen">
    <h2>面试已结束</h2>
    <p>感谢你的投入。报告正在生成中。</p>
    <div class="end-stats">
      <div><b id="endTime">00:00</b>通话时长</div>
      <div><b id="endQ">0</b>已作答题目</div>
      <div><b id="endScore">--</b>综合评分</div>
    </div>
    <button class="btn primary" onclick="alert('报告页（七维评分 + 关键片段回放）将在 M1 评分链路接入后开放')">查看报告</button>
    <button class="btn" onclick="resetCall()">再聊一次</button>
  </div>
</div>

<script>
/* =========================================================================
   语音电话式 AI 模拟面试 —— 通话页骨架（call.html）
   本文件为「纯前端骨架」，可离线预览；后端链路（WebSocket / TTS / ASR / 评分）
   以清晰 stub 标注，待 M1 阶段对接 voice-probe 已验证的协议。

   === 后端接入点（M1 阶段对接，替换下方 DEMO 逻辑）========================
   // 后端模型（阿里云百炼，详见 config/voice_models.json）：
   //   LLM  qwen3.5-plus         （追问/逻辑，必须 enable_thinking=false）
   //   ASR  fun-asr              （候选人录音 → 公网URL → 异步转写）
   //   TTS  cosyvoice-v3.5-flash （缺失 WorkspaceId 时用已验证的 cosyvoice-v3-flash）
   // 1) 实时音频通道（沿用 voice-probe 验证过的 WebSocket 握手）
   //    const ws = new WebSocket(`wss://${location.host}/api/voice`);
   //    ws.onmessage = (e) => handleServerEvent(JSON.parse(e.data));
   // 2) AI 台词合成：/api/voice/tts(spoken_prompt) → 流式(SSE, TTFB≈0.51s) 播放
   //    speak(text) 目前为本地延时模拟，真实环境改为流式播放 TTS 音频并同步字幕。
   // 3) 用户语音识别：浏览器 getUserMedia → 送 ws → /api/voice/stt(fun-asr) 返回转写
   //    → appendUserBubble(transcript)；当前由 demoInput 模拟。
   // 4) 评分：挂断后把转写 + 音频片段 POST /api/voice/score → 七维报告
   //    （见 data/voice_scoring_template.json）。
   ========================================================================= */

// ---- 演示题库（真实环境从 data/questions_voice.json 按岗位加载）----
const DEMO_QUESTIONS = [
  { type: "开场", text: "你好，我是今天的面试官。我们做一个 12 分钟的模拟面试，放松一点，就当真实通话。先做个自我介绍吧。" },
  { type: "自我介绍", text: "我们先从自我介绍开始吧。用两分钟介绍一下你自己，挑一个你最拿得出手的项目讲讲，也说说你为什么对这个岗位感兴趣。" },
  { type: "项目经历", text: "刚才你提到那个项目，能具体讲讲你在里面负责的模块，以及遇到最大的坑是什么、怎么填上的吗？" },
  { type: "场景题", text: "我们来聊个场景：如果线上接口突然大面积超时，你从接到告警到定位根因，会按什么步骤排查？" },
  { type: "压力题", text: "你刚才说的方案我觉得太理想化了。如果老板就在旁边盯着、要求半小时内必须恢复，你会怎么取舍？" },
  { type: "反问环节", text: "差不多了，最后给你个机会——你有什么想问我的吗？关于团队、业务或者这个岗位都行。" }
];

let state = "idle";        // idle | connecting | incall | ended
let qIndex = 0;
let answered = 0;
let seconds = 0;
let timerId = null;
let muted = false;
let subOn = true;
let speaking = false;

const $ = (id) => document.getElementById(id);
const subs = $("subs");
const viz = $("viz");
const avatarWrap = $("avatarWrap");

// ---- 时钟 ----
function tickClock() {
  const d = new Date();
  $("clock").textContent = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
setInterval(tickClock, 1000); tickClock();

// ---- 计时器 ----
function startTimer() {
  timerId = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds/60)).padStart(2,"0");
    const s = String(seconds%60).padStart(2,"0");
    $("timer").textContent = `${m}:${s}`;
  }, 1000);
}

// ---- 字幕气泡 ----
function appendBubble(who, tag, text) {
  const b = document.createElement("div");
  b.className = "bubble " + who;
  b.innerHTML = `<span class="tag">${tag}</span>${text}`;
  subs.appendChild(b);
  subs.scrollTop = subs.scrollHeight;
}

function setSpeaking(on) {
  speaking = on;
  viz.classList.toggle("speaking", on);
  avatarWrap.classList.toggle("speaking", on);
}

// ---- AI 台词播放（DEMO：本地延时模拟；真实环境接 TTS+<audio>）----
function speak(text, tag, cb) {
  setSpeaking(true);
  appendBubble("ai", tag, text);
  // 估算“说话时长”≈ 字数 * 180ms，仅用于演示节奏
  const dur = Math.min(4000, Math.max(900, text.length * 110));
  setTimeout(() => {
    setSpeaking(false);
    if (cb) cb();
  }, dur);
}

// ---- 用户作答（DEMO：由输入框模拟；真实环境由 ASR 转写触发）----
function sendDemo() {
  const inp = $("demoInput");
  const v = inp.value.trim();
  if (!v || state !== "incall") return;
  appendBubble("me", "你", v);
  inp.value = "";
  answered++;
  // 模拟 AI 简短确认后进入下一题
  setTimeout(() => nextQuestion(), 700);
}

// ---- 流程推进 ----
function nextQuestion() {
  if (qIndex >= DEMO_QUESTIONS.length) {
    appendBubble("ai", "面试官", "今天的模拟就到这里，辛苦了。稍后你可以在报告里看到逐题回放和七维评分。");
    setTimeout(hangup, 2200);
    return;
  }
  const q = DEMO_QUESTIONS[qIndex++];
  speak(q.text, q.type, () => {
    // 等待用户作答：DEMO 中由 sendDemo 触发下一题；真实环境由“静默/收束”规则推进
  });
}

function connect() {
  state = "connecting";
  $("callState").textContent = "正在接通…";
  $("hint").style.display = "block";
  setTimeout(() => {
    state = "incall";
    $("callState").textContent = "通话中";
    $("hint").style.display = "none";
    startTimer();
    nextQuestion();
  }, 1800);
}

// ---- 控件 ----
function toggleMute() {
  muted = !muted;
  const b = $("btnMute");
  b.classList.toggle("active", muted);
  b.querySelector("span:last-child").textContent = muted ? "已静音" : "静音";
  // 真实环境：静音时停止向服务器发送麦克风音频
}
function toggleSub() {
  subOn = !subOn;
  $("btnSub").classList.toggle("active", subOn);
  subs.classList.toggle("hidden", !subOn);
}
function hangup() {
  if (state === "ended") return;
  state = "ended";
  setSpeaking(false);
  clearInterval(timerId);
  $("callState").textContent = "已结束";
  const m = String(Math.floor(seconds/60)).padStart(2,"0");
  const s = String(seconds%60).padStart(2,"0");
  $("endTime").textContent = `${m}:${s}`;
  $("endQ").textContent = answered;
  $("endScore").textContent = "--"; // 真实环境由 /api/voice/score 回填
  $("endScreen").classList.add("show");
}
function resetCall() {
  state = "idle"; seconds = 0; qIndex = 0; answered = 0;
  $("timer").textContent = "00:00";
  $("endScreen").classList.remove("show");
  subs.innerHTML = "";
  connect();
}

// ---- 启动 ----
connect();
</script>
</body>
</html>
