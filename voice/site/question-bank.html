<body>
  <main class="container">
    <h1 class="page-title">题库与知识点导航</h1>
    <p class="page-sub">按行业、岗位、题型、知识点标签筛选题目，展开查看评分要点与参考答案框架。</p>

    <div class="card">
      <div class="field">
        <div class="field-label">搜索题目（题干 / 考察意图 / 关键词）</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <input id="f-q" type="search" placeholder="如：线程池、留存、结构化面试、HACCP" style="flex:1;min-width:220px;">
          <button class="btn" id="btn-search-all">搜全库 →</button>
          <button class="btn btn-ghost" id="btn-clear">清除</button>
        </div>
        <p class="page-sub" id="q-hint" style="margin-top:6px;font-size:12px;"></p>
      </div>
      <div class="grid-3">
        <div class="field"><div class="field-label">行业</div><select id="f-industry"></select></div>
        <div class="field"><div class="field-label">岗位</div><select id="f-role"></select></div>
        <div class="field"><div class="field-label">题型</div><select id="f-type"></select></div>
      </div>
      <div class="field"><div class="field-label">知识点标签</div><select id="f-tag"></select></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="ic"></span>题目列表 <span id="count" style="color:var(--wb-muted);font-weight:400;font-size:13px;"></span></div>
      <div id="list"></div>
    </div>
